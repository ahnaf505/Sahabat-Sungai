name: Release Android APK

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v1.1.2."
            exit 1
          fi

          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npx expo lint

      - name: Generate the Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew app:assembleRelease --stacktrace
        working-directory: android

      - name: Package and verify release APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          apk_name="Sahabat-Sungai-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_name"
          test -s "$apk_name"
          unzip -l "$apk_name" | grep -q "assets/index.android.bundle"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk_name="Sahabat-Sungai-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk_name" --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" "$apk_name" \
              --title "Sahabat Sungai ${TAG}" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
