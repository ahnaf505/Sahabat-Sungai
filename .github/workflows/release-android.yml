name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v1.1.2."
            exit 1
          fi

          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Build installable APK
        run: ./gradlew app:assembleDebug
        working-directory: android

      - name: Package APK for the release
        env:
          TAG: ${{ github.ref_name }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Sahabat-Sungai-${TAG}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "Sahabat-Sungai-${TAG}.apk" \
            --title "Sahabat Sungai ${TAG}" \
            --generate-notes
